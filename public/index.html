<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Student Registration</h2>
    <form action="/add-student" method="POST">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Siddhanta Panigrahi">
      </div>

      <div class="form-group">
        <label for="roll_number">Roll Number</label>
        <input type="number" id="roll_number" name="roll_number" required placeholder="e.g. 101">
      </div>

      <div class="form-group">
        <label for="date_of_birth">Date of Birth</label>
        <input type="date" id="date_of_birth" name="date_of_birth" required>   
      </div>

      <div class="form-group">
        <label for="place">Place</label>
        <input type="text" id="place" name="place" required placeholder="e.g. cuttack">
      </div>

      <button type="submit">Save to Database</button>
    </form>
  </div>
</body>
</html>
