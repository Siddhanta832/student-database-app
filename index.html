<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { display: flex; flex-direction: column; width: 300px; gap: 10px; }
    input, button { padding: 8px; font-size: 14px; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Add Student Details</h2>
  <form action="/add-student" method="POST">
    <label>Full Name:</label>
    <input type="text" name="name" required placeholder="e.g. Rahul Sharma">

    <label>Roll Number:</label>
    <input type="number" name="roll_number" required placeholder="e.g. 101">

    <label>Date of Birth:</label>
    <input type="date" name="date_of_birth" required>

    <label>Place:</label>
    <input type="text" name="place" required placeholder="e.g. Bangalore">

    <button type="submit">Save to Database</button>
  </form>
</body>
</html>
